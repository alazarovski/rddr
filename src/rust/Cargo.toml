[package]
name = "airspaceprofile"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
r-api = ["dep:extendr-api"]

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
csv = "=1.4.0"
rstar = "=0.11.0"
extendr-api = { version = "=0.9.0", features = ["result_condition"], optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
